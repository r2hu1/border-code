# This workflow builds the standalone binaries for all supported platforms.
# It runs on every push to the main branch and can be triggered manually.
name: Build All

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build macOS (arm64)
        run: |
          bun run build:mac

      - name: Build macOS (x64)
        run: |
          bun run build:mac-x64

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: border-code-macos
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build Linux (x64)
        run: |
          bun run build:linux

      - name: Build Linux (arm64)
        run: |
          bun run build:linux-arm

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: border-code-linux
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build Windows (x64)
        run: |
          bun run build:windows

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: border-code-windows
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: [build-mac, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: border-code-macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: border-code-linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: border-code-windows

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload macOS (arm64) Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: border-code-macos
          asset_name: border-code-macos
          asset_content_type: application/octet-stream

      - name: Upload macOS (x64) Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: border-code-macos-x64
          asset_name: border-code-macos-x64
          asset_content_type: application/octet-stream

      - name: Upload Linux (x64) Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: border-code-linux
          asset_name: border-code-linux
          asset_content_type: application/octet-stream

      - name: Upload Linux (arm64) Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: border-code-linux-arm
          asset_name: border-code-linux-arm
          asset_content_type: application/octet-stream

      - name: Upload Windows Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: border-code-windows.exe
          asset_name: border-code-windows.exe
          asset_content_type: application/octet-stream
