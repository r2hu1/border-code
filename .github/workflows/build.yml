name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            name: border-code-macos-arm64
          - os: macos-latest
            target: bun-darwin-x64
            name: border-code-macos-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            name: border-code-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            name: border-code-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            name: border-code-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install dependencies
        run: bun install

      - name: build
        run: bun build packages/cli/src/index.tsx --compile --outfile dist/${{ matrix.name }} --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
