name: Build CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            suffix: ""
          - os: macos-latest
            target: bun-darwin-arm64
            suffix: ""
          - os: macos-13
            target: bun-darwin-x64
            suffix: ""
          - os: windows-latest
            target: bun-windows-x64
            suffix: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build standalone executable
        run: |
          bun build --compile \
            --target=${{ matrix.target }} \
            --sourcemap \
            --minify \
            --outfile=border-code-${{ matrix.target }}${{ matrix.suffix }} \
            packages/cli/src/index.tsx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: border-code-${{ matrix.target }}
          path: border-code-${{ matrix.target }}${{ matrix.suffix }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: border-code-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: border-code-*
          generate_release_notes: true
